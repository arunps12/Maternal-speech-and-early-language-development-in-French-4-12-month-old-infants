[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "french-ids"
version = "0.1.2"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "praat-parselmouth>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
notebooks = ["matplotlib>=3.7", "seaborn>=0.13", "jupyter>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/french_ids"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
